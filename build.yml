name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir www
          cp index.html www/
      - name: Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Pannacrow Till" com.pannacrow.till --web-dir=www
          npx cap add android
          npx cap sync android
      - name: App icon
        run: |
          mkdir assets
          cp icon.png assets/icon.png
          npm install @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#2e292d' --iconBackgroundColorDark '#2e292d'
      - name: Fixed signing key
        run: |
          mkdir -p ~/.android
          base64 -d keystore.b64.txt > ~/.android/debug.keystore
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Pannacrow-Till.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: till-${{ github.run_number }}
          name: Pannacrow Till build ${{ github.run_number }}
          files: Pannacrow-Till.apk
