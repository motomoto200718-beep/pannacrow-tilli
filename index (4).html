<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pannacrow Till</title>
<style>
:root{--bg:#efe3cf;--card:#fbf5ea;--card2:#e6d6bb;--line:#d8c4a2;--ink:#2a1409;--mute:#7a6450;--cta:#2a1409;--on-cta:#f7efe1;--ok:#2f7d4f;--warn:#a9761f;--bad:#b3402c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17120f;--card:#211a16;--card2:#2a211c;--line:#3a2e27;--ink:#f2e8da;--mute:#a2917f;--cta:#d4a63f;--on-cta:#1b130d;--ok:#6fc08f;--warn:#d9a93e;--bad:#e58a74;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17120f;--card:#211a16;--card2:#2a211c;--line:#3a2e27;--ink:#f2e8da;--mute:#a2917f;--cta:#d4a63f;--on-cta:#1b130d;--ok:#6fc08f;--warn:#d9a93e;--bad:#e58a74;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:3;background:var(--bg)}
header{display:flex;align-items:center;gap:8px;padding:10px 16px 6px}
.logo{width:44px;height:44px;border-radius:50%;object-fit:cover}
.brand{font:600 22px Georgia,"Times New Roman",serif}
.grow{flex:1}
.hint,small,.price{color:var(--mute)}
.small{font-size:13px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;white-space:nowrap}
.pill.on{background:var(--cta);color:var(--on-cta);border-color:var(--cta)}
.pill:disabled{opacity:.4;cursor:default;text-decoration:line-through}
.tabs{display:flex;gap:8px;padding:0 16px 10px;overflow-x:auto}
main{max-width:1100px;margin:0 auto;padding:6px 16px 28px}
h2{font:600 26px Georgia,"Times New Roman",serif;margin:4px 0 2px}
h3{font:600 18px Georgia,"Times New Roman",serif;margin:0 0 8px}
h4{margin:14px 0 6px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.panel2{background:var(--card2);border-radius:16px;padding:12px 14px;margin:10px 0 14px}
.center{display:grid;place-items:center;min-height:70vh}
.narrow{width:100%;max-width:400px;text-align:center;padding:24px;border-radius:22px}
.dots{display:flex;justify-content:center;gap:14px;margin:18px 0 6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mute)}
.dots i.f{background:var(--cta);border-color:var(--cta)}
.err{min-height:22px;color:var(--bad);font-weight:600}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.pad button{height:64px;border-radius:16px;border:1px solid var(--line);background:var(--bg);font-size:24px;font-weight:600}
.pad button:active{background:var(--card2)}
.cta{width:100%;min-height:56px;margin-top:12px;border:0;border-radius:14px;background:var(--cta);color:var(--on-cta);font-size:18px;font-weight:700;display:flex;justify-content:space-between;align-items:center;padding:0 18px}
.cta.c{justify-content:center}
.cta:disabled{opacity:.35;cursor:default}
.ghost{width:100%;min-height:46px;margin-top:8px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.link{background:none;border:0;color:var(--mute);padding:8px}
label{display:grid;gap:6px;text-align:left;color:var(--mute);font-size:14px;margin:10px 0}
input,textarea{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:12px;font-size:20px}
textarea{font-size:14px;min-height:220px}
.till{display:grid;gap:16px}
@media(min-width:860px){.till{grid-template-columns:1fr 340px;align-items:start}.order{position:sticky;top:132px;max-height:calc(100vh - 150px)}}
.cats{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;cursor:pointer}
.tile.out{opacity:.45;cursor:default}
.tile img,.tile .ph{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px}
.ph{display:grid;place-items:center;background:var(--card2);color:var(--mute);font:600 34px Georgia,serif}
.th{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:0 0 auto;font-size:18px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 4px 2px}
.add{width:34px;height:34px;border-radius:50%;border:0;background:var(--cta);color:var(--on-cta);font-size:20px;line-height:1;flex:0 0 auto}
.q{position:absolute;top:14px;left:14px;background:var(--cta);color:var(--on-cta);font-style:normal;font-weight:700;border-radius:999px;padding:2px 9px;font-size:13px}
.tag{position:absolute;top:14px;right:14px;font-style:normal;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.tag.low{color:var(--warn)}.tag.out{color:var(--bad)}
.spr{display:flex;gap:10px;overflow-x:auto}
.spi{flex:0 0 auto;display:flex;align-items:center;gap:10px;background:var(--card);border:0;border-radius:12px;padding:6px 12px 6px 6px;text-align:left}
.order{display:flex;flex-direction:column;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.oh{display:flex;justify-content:space-between;align-items:baseline}
.oh b{font:600 20px Georgia,"Times New Roman",serif}
.lines{list-style:none;margin:8px 0;padding:0;flex:1;overflow:auto}
.lines li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.n{flex:1;min-width:0}
.n small{display:block}
.step{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.step button{min-width:32px;height:32px;border-radius:16px;border:1px solid var(--line);background:none;padding:0 8px}
.empty{color:var(--mute);padding:12px 0;border-top:1px solid var(--line)}
@media(max-width:859px){.order{position:sticky;bottom:0;max-height:46vh;margin:12px -16px 0;border-radius:18px 18px 0 0}}
.r{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px}
.r.dim .th{opacity:.5}
.info{flex:1;min-width:160px;display:grid;gap:3px}
.d{font-size:13px;color:var(--mute)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--mute)}
.chip.bad{color:var(--bad);border-color:var(--bad)}.chip.warn{color:var(--warn);border-color:var(--warn)}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}.bar i.low{background:var(--warn)}.bar i.out{background:var(--bad)}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.star{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:none;font-size:18px;color:var(--mute)}
.star.on{background:var(--cta);color:var(--on-cta);border-color:var(--cta)}
.sw{width:26px;height:26px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px}
.opts .pill{display:inline-flex;align-items:center}.pool b{display:flex;align-items:center}
.cols{display:grid;gap:18px}
@media(min-width:900px){.cols{grid-template-columns:1.35fr 1fr;align-items:start}}
.pools{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.pool{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:4px}
.big2{font-size:30px;font-weight:700;line-height:1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.top2{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin:6px 0 10px}
.orow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.orow>button{all:unset;display:flex;justify-content:space-between;width:100%;cursor:pointer}
.det{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.ln{display:flex;justify-content:space-between;padding:3px 0;gap:10px}
.row{display:flex;justify-content:space-between;padding:10px 0}
.row+.row{border-top:1px solid var(--line)}
.ok{display:inline-block;color:var(--ok);border:1px solid var(--ok);border-radius:999px;padding:4px 12px;font-weight:600}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:5}
#sheet[hidden]{display:none}
.sp{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:6px}
.hero{display:block;width:calc(100% + 32px);margin:-16px -16px 8px;aspect-ratio:16/9;object-fit:cover;border-radius:18px 18px 0 0}
.g{margin:10px 0}.g h4{margin:0 0 8px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.tl{min-height:60px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:700}
.tl.on{background:var(--cta);color:var(--on-cta);border-color:var(--cta)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick button{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600}
.chg{min-height:30px;font-size:20px;font-weight:700;margin:6px 0}.chg.bad{color:var(--bad)}
.big{font-size:44px;font-weight:700;margin:4px 0}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin:10px 0;text-align:left}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two a,.two button{text-align:center;text-decoration:none;margin:0}
a.cta{color:var(--on-cta);justify-content:center;margin:0}
.bottom{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;margin-top:8px}
.diff{font-size:20px;font-weight:700;min-height:28px}.diff.bad{color:var(--bad)}.diff.good{color:var(--ok)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--cta);color:var(--on-cta);padding:10px 16px;border-radius:999px;font-weight:600;z-index:9;max-width:90vw;text-align:center}
#toast[hidden]{display:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--cta);outline-offset:2px}
</style>
</head>
<body>
<div class="top" id="top"></div>
<main id="view"></main>
<div id="sheet" hidden><div class="sp" id="sp"></div></div>
<div id="toast" hidden></div>

function vOrders(){const L=S.orders.slice().reverse().slice(0,60);return `<h2>Orders</h2><p class="hint" style="margin:0 0 12px">Saved on this device. Newest first.</p>${L.map(o=>`<div class="orow"><button data-a="open" data-v="${o.n}"><span><b>#${o.n}</b> · ${o.d?o.d+" · ":""}${o.t} · ${o.m}${o.st==="req"?`<span class="chip warn" style="margin-left:6px">Void review requested</span>`:""}</span><b>${money(o.total)}</b></button>${oid===o.n?`<div class="det">${o.lines.map(l=>`<div class="ln"><span>${esc(l.name)} × ${l.q}${l.opts?`<small> · ${esc(l.opts)}</small>`:""}</span><span>${money(l.q*l.unit)}</span></div>`).join("")}${o.ref?`<div class="ln"><small>Reference</small><small>${esc(o.ref)}</small></div>`:""}<div class="ln"><small>Served by</small><small>${esc(o.who)}</small></div>${o.st==="req"?`<p class="hint" style="margin:8px 0 0">Reason: ${esc(o.why)}. Waiting for the owner.</p>`:`<button class="ghost" data-a="voidsheet" data-v="${o.n}">Request a void review</button>`}</div>`:""}</div>`).join("")||`<div class="empty">No orders yet. Completed sales appear here and stay saved on this device.</div>`}<div class="card"><b>Owner review</b><p class="hint" style="margin:6px 0 0">A completed sale can’t be edited. Send a void request with a reason. The sale stays on the record until the owner approves it.</p></div>`}

function chargeSheet(){const t=total(cur);sheet(`<h2>Charge ${money(t)}</h2><div class="tiles"><button class="tl${pay.m==="Cash"?" on":""}" data-a="method" data-v="Cash">Cash</button><button class="tl${pay.m!=="Cash"?" on":""}" data-a="method" data-v="Mobile Money">Mobile Money</button></div>${pay.m==="Cash"?`<label>Cash received<input id="recv" inputmode="decimal" placeholder="0.00" value="${esc(pay.recv)}"></label><div class="quick">${[1,2,5,10,20,"Exact"].map(v=>`<button data-a="qcash" data-v="${v}">${v==="Exact"?"Exact":"$"+v}</button>`).join("")}</div><div class="chg" id="chg"></div>`:`<label>Reference from the Mobile Money message<input id="ref" placeholder="e.g. transaction code" value="${esc(pay.ref)}"></label><p class="hint" style="margin:0">Recorded only. This app never moves money.</p>`}<button class="cta c" id="go" data-a="complete" disabled>Complete sale</button><button class="ghost" data-a="close">Back</button><p class="hint small" style="margin:6px 0 0">Sales are final once recorded. Ask the owner to review a void.</p>`);updPay()}
function updPay(){const t=total(cur);let ok=false;if(pay.m==="Cash"){const v=parseFloat(pay.recv),c=$("#chg");if(!isNaN(v)){if(v>=t){ok=true;c.textContent="Change due: "+money(r2(v-t));c.className="chg"}else{c.textContent="Short by "+money(r2(t-v));c.className="chg bad"}}else c.textContent=""}else ok=pay.ref.trim().length>=4;$("#go").disabled=!ok}
function doneSheet(o){const ch=r2(o.paid-o.total);sheet(`<div style="text-align:center"><span class="ok">Sale recorded</span><h2>Order #${o.n}</h2>${o.m==="Cash"?`<p class="hint" style="margin:0">Change due</p><div class="big">${money(ch)}</div>`:`<div class="big">${money(o.total)}</div>`}</div><div class="box"><div class="row"><span>Total</span><b>${money(o.total)}</b></div><div class="row"><span>Paid by</span><b>${o.m}</b></div>${o.m==="Cash"?`<div class="row"><span>Cash received</span><b>${money(o.paid)}</b></div>`:`<div class="row"><span>Reference</span><b>${esc(o.ref)}</b></div>`}<div class="row"><span>Served by</span><b>${esc(o.who)}</b></div></div><button class="cta c" data-a="close">New order</button>`)}
function voidSheet(n){CTX={vn:n,why:""};sheet(`<h2>Void review · Order #${n}</h2><p class="hint" style="margin:0">Pick a reason. The sale stays on the record until the owner approves.</p><div class="opts" style="margin:10px 0">${["Wrong item","Customer changed their mind","Overcharged","Duplicate sale","Other"].map(r=>`<button class="pill" data-a="reason" data-v="${r}">${r}</button>`).join("")}</div><button class="cta c" id="send" data-a="sendvoid" disabled>Send request</button><button class="ghost" data-a="close">Cancel</button>`)}
function endSheet(){sheet(`<h2>Count the drawer</h2><p class="hint" style="margin:0">Expected: <b>${money(stats().exp)}</b></p><label>Cash counted<input id="cnt" inputmode="decimal" placeholder="0.00"></label><div class="diff" id="df"></div><button class="cta c" id="fin" data-a="finalend" disabled>Close shift</button><button class="ghost" data-a="close">Cancel</button>`)}
function doReset(){try{localStorage.removeItem(KEY)}catch(e){}S=load();applyOv();theme(S.theme||"light");cur=[];who="";scr="lock";ownerOK=false;closeSheet();render();toast("All data reset")}
function ownerSheet(after){afterOwner=after;const set=!S.opin;sheet(`<h2>${set?"Set the owner PIN":"Owner PIN"}</h2><p class="hint" style="margin:0">${set?"Choose a 4-digit PIN. It protects price and stock changes. Keep it to yourself.":"Enter the owner PIN to edit prices and stock."}</p><label><input id="opin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••"></label><div class="err" id="oerr"></div><button class="ghost" data-a="close">Cancel</button>`);setTimeout(()=>{const e=$("#opin");if(e)e.focus()},60)}
function editSheet(i){const it=I[i];CTX={e:i};sheet(`<h2>Edit ${it.n}</h2><label>Price ($)<input id="ep" inputmode="decimal" placeholder="0.00" value="${it.p===null?"":it.p.toFixed(2)}"></label>${it.t==="un"?`<label>Stock count<input id="es" inputmode="numeric" value="${S.st[i]}"></label>`:""}${it.t==="sc"?`<label>Scoops used per sale<input id="ec" inputmode="numeric" value="${it.s}"></label><p class="hint small" style="margin:0">Scoop stock is set on the ice cream stock cards.</p>`:""}<div class="err" id="ee"></div><button class="cta c" data-a="saveedit">Save</button><button class="ghost" data-a="close">Cancel</button><p class="hint small" style="margin:6px 0 0">Price changes apply to new orders. Past orders keep the price they sold at.</p>`)}
/* ---------- actions ---------- */
function login(w){const sh=S.shift;if(sh&&!sh.closed&&sh.who!==w){msg="Shift is open under "+sh.who+". They must end it first.";return}who=w;scr=(sh&&!sh.closed)?"app":"shift";tab="till"}
const ACT={
theme(){theme(dark()?"light":"dark");render()},
key(v){if(Date.now()<until)return;if(v==="del")pin=pin.slice(0,-1);else if(pin.length<4)pin+=v;msg="";if(pin.length===4){const w=staffDraft.trim();if(pin==="1234"&&w){tries=0;pin="";staffDraft="";login(w)}else{tries++;pin="";if(tries>=3){tries=0;until=Date.now()+30000;if(!tm)tm=setInterval(()=>{render();if(Date.now()>=until){clearInterval(tm);tm=null;render()}},1000)}else msg=!w?"Enter a staff name first.":"Wrong PIN. Please try again."}}render()},
lock(){who="";staffDraft="";scr="lock";pin="";msg="";cur=[];ownerOK=false;closeSheet();render()},
openshift(){const v=parseFloat($("#fl").value);if(isNaN(v)||v<0){$("#fe").textContent="Enter the cash float, for example 20.00";return}S.shift={id:Date.now(),who,start:tnow(),startDay:day(),float:v,closed:null};save();scr="app";tab="till";render()},
tab(v){tab=v;render()},cat(v){cat=v;render()},
tile(v){const i=+v,it=I[i];if(stat(i)==="out")return toast(it.n+" is sold out");if(it.g.length){CTX={i,sel:{},q:1,note:""};itemSheet()}else{addLine(i,{},1,"");render()}},
quick(v,b){const i=+v,it=I[i];if(stat(i)==="out")return toast(it.n+" is sold out");if(hasReq(it)){CTX={i,sel:{},q:1,note:""};itemSheet()}else{addLine(i,{},1,"");render()}},
ln(v){const p=v.split(":"),k=+p[0],d=+p[1],l=cur[k];if(d>0){const nx=cur.map((x,j)=>j===k?Object.assign({},x,{q:x.q+1}):x);if(!fits(nx))return toast("Not enough stock for that");cur=nx}else{l.q+=d;if(l.q<=0)cur.splice(k,1)}render()},
clear(){cur=[];render()},
pick(v,b){const g=b.dataset.g,grp=groups(I[CTX.i]).find(x=>x.k===g),o={name:b.dataset.o,price:+b.dataset.p},arr=CTX.sel[g]||[],has=arr.some(x=>x.name===o.name);CTX.sel[g]=grp.m?(has?arr.filter(x=>x.name!==o.name):arr.concat([o])):[o];CTX.note=$("#nt").value;itemSheet()},
qq(v){CTX.q=Math.max(1,Math.min(9,CTX.q+(+v)));CTX.note=$("#nt").value;itemSheet()},
addsheet(){if(addLine(CTX.i,CTX.sel,CTX.q,$("#nt").value.trim())){closeSheet();toast(I[CTX.i].n+" added");render()}},
close(){closeSheet();render()},
charge(){pay={m:"Cash",recv:"",ref:""};chargeSheet()},
method(v){pay.m=v;chargeSheet()},
qcash(v){pay.recv=(v==="Exact"?total(cur):+v).toFixed(2);const r=$("#recv");if(r)r.value=pay.recv;updPay()},
complete(){const t=total(cur);if(!fits(cur))return toast("Stock changed. Check the order");const v=parseFloat(pay.recv),u=use(cur);Object.keys(u.P).forEach(f=>{S.P[f]-=u.P[f]});Object.keys(u.U).forEach(k=>{S.st[k]-=u.U[k]});const o={n:S.next++,t:tnow(),d:day(),sid:S.shift.id,who,m:pay.m,ref:pay.m==="Cash"?"":pay.ref.trim(),paid:pay.m==="Cash"?v:t,total:t,st:"ok",why:"",lines:cur.map(l=>({name:I[l.id].n,opts:lopts(l)+(l.note?" “"+l.note+"”":""),q:l.q,unit:unit(l)}))};S.orders.push(o);save();cur=[];doneSheet(o);render()},
open(v){oid=oid===+v?null:+v;render()},
voidsheet(v){voidSheet(+v)},
reason(v,b){CTX.why=v;document.querySelectorAll("[data-a=reason]").forEach(x=>x.classList.toggle("on",x===b));$("#send").disabled=false},
sendvoid(){const o=S.orders.find(x=>x.n===CTX.vn);o.st="req";o.why=CTX.why;save();const t="Void review request\nOrder #"+o.n+" · "+o.t+" · "+money(o.total)+" · "+o.m+"\nReason: "+o.why+"\nRequested by "+who;textSheet("Request ready",t,`<p class="hint" style="margin:0">Send it to the owner. The sale stays on the record.</p>`);render()},
um(v){const i=+v;S.st[i]=Math.max(0,S.st[i]-1);save();render()},up(v){S.st[+v]+=1;save();render()},ut(v){S.st[+v]+=10;save();render()},
pm(v){S.P[v]=Math.max(0,S.P[v]-1);save();render()},pp(v){S.P[v]+=1;save();render()},pt(v){S.P[v]+=TUB;save();render()},
star(v){S.sp[+v]=!S.sp[+v];save();render()},
tog(v){const i=+v;if(!S.on[i]&&I[i].p===null)return toast("The owner needs to set a price first");S.on[i]=!S.on[i];if(!S.on[i])S.sp[i]=false;save();toast(I[i].n+(S.on[i]?" is on the menu":" is off the menu"));render()},
ao(v){S.ao[+v]=!S.ao[+v];save();render()},
share(){textSheet("Today’s menu",menuText())},
rep(){textSheet((S.shift.closed?"End-of-shift":"Midday")+" report",report(S.shift.closed?"End-of-shift":"Midday"))},
endsheet(){endSheet()},
finalend(){const c=r2(parseFloat($("#cnt").value));S.shift.closed={c,d:r2(c-stats().exp),t:tnow()};save();textSheet("End-of-shift report",report("End-of-shift"));render()},
copy(){const t=$("#txt");t.select();const ok=()=>toast("Copied. Paste it into WhatsApp"),bad=()=>toast("Press and hold the text to copy");if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(ok,()=>{try{document.execCommand("copy");ok()}catch(e){bad()}});else{try{document.execCommand("copy");ok()}catch(e){bad()}}},
reset(){ownerOK?doReset():ownerSheet(doReset)},
edit(v){const i=+v;ownerOK?editSheet(i):ownerSheet(()=>editSheet(i))},
saveedit(){const i=CTX.e,it=I[i],er=$("#ee"),p=parseFloat($("#ep").value);if(isNaN(p)||p<0)return er.textContent="Enter a price, for example 1.50";let s=null,c=null;if(it.t==="un"){s=parseInt($("#es").value,10);if(isNaN(s)||s<0)return er.textContent="Enter the stock count"}if(it.t==="sc"){c=parseInt($("#ec").value,10);if(isNaN(c)||c<1||c>12)return er.textContent="Scoops per sale must be 1 to 12"}S.pr[i]=r2(p);it.p=r2(p);if(s!==null)S.st[i]=s;if(c!==null){S.sc[i]=c;it.s=c}save();closeSheet();toast(it.n+" updated");render()},
pset(v){CTX={pf:v};sheet(`<h2>${v} scoops</h2><p class="hint" style="margin:0">Count what is left in the freezer and enter it. One tub is about ${TUB} scoops.</p><label>Scoops left<input id="pv" inputmode="numeric" value="${S.P[v]}"></label><div class="err" id="pe"></div><button class="cta c" data-a="savepool">Save</button><button class="ghost" data-a="close">Cancel</button>`)},
savepool(){const n=parseInt($("#pv").value,10);if(isNaN(n)||n<0)return $("#pe").textContent="Enter a number";S.P[CTX.pf]=n;save();closeSheet();render()}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.disabled)return;const f=ACT[b.dataset.a];if(f)f(b.dataset.v,b)});
document.addEventListener("input",e=>{const id=e.target.id;if(id==="staff"){staffDraft=e.target.value;return}if(id==="recv"){pay.recv=e.target.value;updPay()}else if(id==="ref"){pay.ref=e.target.value;updPay()}else if(id==="cnt"){const v=parseFloat(e.target.value),df=$("#df"),b=$("#fin");if(isNaN(v)){df.textContent="";b.disabled=true;return}const d=r2(v-stats().exp);b.disabled=false;df.textContent=d===0?"Matches":(d>0?"Over by ":"Short by ")+money(Math.abs(d));df.className="diff "+(d===0?"good":"bad")}});
document.addEventListener("input",e=>{if(e.target.id!=="opin")return;const v=e.target.value.replace(/\D/g,"");e.target.value=v;if(v.length<4)return;const go=()=>{ownerOK=true;closeSheet();const f=afterOwner;afterOwner=null;if(f)f()};if(!S.opin){S.opin=hs(v);save();toast("Owner PIN set");go()}else if(S.opin===hs(v))go();else{$("#oerr").textContent="Wrong owner PIN";e.target.value=""}});
render();
</script>
</body>
</html>
